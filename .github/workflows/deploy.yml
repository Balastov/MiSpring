name: Deploy to VM

on:
  push:
    branches: [main]

# Нужно, чтобы job «bump» мог пушить теги в репозиторий (GITHUB_TOKEN).
permissions:
  contents: write

jobs:
  version-bump:
    name: Bump version
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CURRENT="${LAST_TAG#v}"
            RANGE="${LAST_TAG}..HEAD"
          else
            CURRENT=$(cat VERSION 2>/dev/null || echo "0.0.0")
            RANGE="HEAD"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          COMMITS=$(git log "$RANGE" --pretty=format:"%s" 2>/dev/null || echo "")

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "BREAKING[[:space:]]CHANGE|^[a-z]+\!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Version: $CURRENT -> $NEW_VERSION ($BUMP)"

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin --tags

  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    needs: version-bump
    if: ${{ always() }}
    # Деплой ждёт тега, чтобы сервер получил актуальный VERSION без служебного коммита в main.
    # Коммиты с [skip ci] тоже деплоятся: для них job version-bump будет skipped.

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/projects/MiSpring
            git fetch --tags origin
            git pull origin main
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LATEST_TAG" ]; then
              printf "%s" "${LATEST_TAG#v}" > VERSION
            fi
            sudo systemctl restart task-tracker
